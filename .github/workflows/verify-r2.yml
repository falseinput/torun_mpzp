name: Verify R2 credentials

# Answers one question in about 20 seconds: are the R2 secrets correct and can
# they write? Cheaper and far easier to read than inferring it from a failed
# build, and the fastest way to re-check whenever the R2 token is rotated.

on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      # Without this R2 rejects uploads with 501 Not Implemented, which looks
      # like a credentials failure but is not one.
      AWS_REQUEST_CHECKSUM_CALCULATION: when_required
      AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
      ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
      BUCKET: ${{ secrets.R2_BUCKET }}
      KEY: test/_verify.txt

    steps:
      - name: Secrets are present
        run: |
          missing=0
          for name in R2_ACCOUNT_ID R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY R2_BUCKET; do
            case "$name" in
              R2_ACCOUNT_ID)        value="${{ secrets.R2_ACCOUNT_ID }}" ;;
              R2_ACCESS_KEY_ID)     value="${{ secrets.R2_ACCESS_KEY_ID }}" ;;
              R2_SECRET_ACCESS_KEY) value="${{ secrets.R2_SECRET_ACCESS_KEY }}" ;;
              R2_BUCKET)            value="${{ secrets.R2_BUCKET }}" ;;
            esac
            if [ -z "$value" ]; then
              echo "::error::$name is empty"
              missing=1
            else
              echo "$name is set (${#value} chars)"
            fi
          done
          exit $missing

      # Validates account id, key, secret and bucket name together. Most
      # mistakes stop here: InvalidAccessKeyId (wrong key), SignatureDoesNotMatch
      # (wrong secret), NoSuchBucket (wrong name), DNS failure (wrong account id).
      - name: Read bucket
        run: aws s3 ls "s3://$BUCKET/" --endpoint-url "$ENDPOINT"

      # R2 API tokens are read-only unless "Object Read & Write" was selected,
      # so listing succeeding does not mean publishing will.
      - name: Write object
        run: |
          echo "verified by run ${{ github.run_id }} at $(date -u +%FT%TZ)" > verify.txt
          aws s3 cp verify.txt "s3://$BUCKET/$KEY" \
            --endpoint-url "$ENDPOINT" --content-type text/plain

      - name: Read back
        run: |
          aws s3 cp "s3://$BUCKET/$KEY" - --endpoint-url "$ENDPOINT"

      - name: Clean up
        if: always()
        run: aws s3 rm "s3://$BUCKET/$KEY" --endpoint-url "$ENDPOINT" || true

      - name: Result
        run: echo "R2 credentials, bucket and write access all OK."
